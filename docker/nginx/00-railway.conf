# Railway's edge overwrites a client-supplied X-Forwarded-For, so the leftmost
# entry is the true client. The edge's own entry rotates per request, which is
# why a right-to-left walk (nginx realip, $proxy_add_x_forwarded_for) must not
# be used here: it would give October's backend login throttle a fresh bucket
# on every attempt.
map $http_x_forwarded_for $railway_client_ip {
    '~^\s*(?P<xff_first>[^,\s]+)'  $xff_first;
    default                        $remote_addr;
}

# The edge terminates TLS and speaks plain HTTP to the container, so PHP only
# learns the real scheme from X-Forwarded-Proto. Left empty for the health
# prober, which sends no such header.
map $http_x_forwarded_proto $railway_https {
    https      on;
    default    '';
}
