[www]
; Sized for a Railway container, not for the 48-core host the pool would
; otherwise be tuned against by hand. 12 children x 256M leaves headroom on the
; default 8 GB service. pm.start_servers must sit between the two spare values
; or php-fpm exits 78 at boot.
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
