; October CMS production PHP settings. Loaded after the runtime image's own
; runtime.ini, so these values win.
expose_php = Off
memory_limit = 256M
max_execution_time = 120
upload_max_filesize = 64M
post_max_size = 64M

; upload_max_filesize and post_max_size are PHP_INI_PERDIR, so an application
; cannot raise them with ini_set() — they have to be set here.

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; October writes PHP to disk at runtime (plugin installs, cached CMS objects),
; so timestamp validation stays on.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
